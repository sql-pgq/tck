[project]
name = "sql-pgq-tck"
version = "0.1.0"
description = "Technology Compatibility Kit for SQL/PGQ (SQL:2023 Part 16, ISO/IEC 9075-16)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

# The specification is the Gherkin under features/. Running it against an engine
# needs a binding, and each binding brings its own dependencies — nothing here
# is required to *read* the suite, only to execute it.
[project.optional-dependencies]
python = [
    "pytest>=7.0",
    "pytest-bdd>=6.0",
    "pandas>=1.5",
]
# The reference binding drives ProGraph, which is installed separately — see the
# README. It is deliberately not an extra here: the TCK must never depend on the
# engine it tests, or another implementation's binding inherits this one's.

[tool.pytest.ini_options]
testpaths = ["implementations/python"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# A scenario a binding declared unimplemented, which then passes, is a stale
# claim that the engine is less capable than it is. Strict xfail turns that
# from a line of run output nobody reads into a failure.
xfail_strict = true
